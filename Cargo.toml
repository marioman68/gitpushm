[package]
name = "gitpushm"
version = "3.0.0"
edition = "2021"
description = "Git Project Push Manager: see every repo in your projects folder, write good commit messages, push."
license = "MIT"

[dependencies]
eframe = "0.29"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
